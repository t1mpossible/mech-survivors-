name: Publish web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7.1
          GODOT_RELEASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -L --retry 3 -o godot.zip "${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -L --retry 3 -o templates.tpz "${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rmdir "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/templates"

      - name: Export browser version
        shell: bash
        run: |
          mkdir -p export/web
          "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64" --headless --path . --export-release Web export/web/index.html

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game build
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
